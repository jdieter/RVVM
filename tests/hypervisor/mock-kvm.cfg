# Disposable Fedora equivalent of a --new-chroot runroot, inside the outer VM.
import os

include('/etc/mock/fedora-44-riscv64.cfg')
config_opts['root'] = 'rvvm-kvm-qualification'
config_opts['chroot_setup_cmd'] = 'install bash coreutils qemu-system-riscv-core'
config_opts['nspawn_args'] += [
    '--bind=/dev/kvm',
    '--bind-ro=/root:/qualification',
    '--bind-ro=/boot:/qualification-boot',
]
# The disposable inner image is supplied to the outer VM as an NVMe disk.
inner_partition = os.path.realpath('/dev/disk/by-uuid/3a919c82-1b63-4c2b-8975-6d5ecc565e61')
assert inner_partition.startswith('/dev/nvme') and inner_partition.endswith('p3')
config_opts['nspawn_args'].append('--bind=' + inner_partition[:-2] + ':/dev/inner-disk')
